services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: traderview-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQL_PASSWORD:-YourStrong!Passw0rd}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./init-db.sh:/init-db.sh
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      - traderview-network

  traderview-server:
    build:
      context: .
      dockerfile: traderview/traderview.Server/Dockerfile
    container_name: traderview-server
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:8080
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
      - AllowedHosts=*
      
      # Database Configurations (Using Environment Variables)
      - ConnectionStrings__TradingDatabase=Server=sqlserver;Database=TradingBE;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=true;Encrypt=true;
      - Database__User=sa
      - Database__Password=${SQL_PASSWORD}
      - Database__Host=sqlserver
      - Database__DbName=TradingBE
      
      # IBKR API & Gateway Settings
      - IBKR__Token=${IBKR_TOKEN}
      - IBKR__QueryId=${IBKR_QUERY_ID}
      - IBKR__QueryTodayExecutionsId=${IBKR_TODAY_EXEC_ID}
      - IBKR__BaseUrl=https://ndcdyn.interactivebrokers.com/AccountManagement/FlexWebService/SendRequest
      - IBKR__OutputFilePath=/app/documents/[FILE_NAME]
      
      - IBKRClient__SocketUrl=host.docker.internal
      - IBKRClient__Port=4002
      - IBKRClient__ClientId=10000
      
      # Market Data Service Selection (yahoo or fmp)
      - MarketData__PreferredService=${MARKET_DATA_SERVICE:-fmp}

      # Financial Modeling Prep API Settings
      - FinancialModelingPrep__ApiKey=${FMP_API_KEY}
      - FinancialModelingPrep__BaseUrl=https://financialmodelingprep.com/stable
      - FinancialModelingPrep__OutputFilePath=/app/documents/[FILE_NAME]

      # Logging Levels
      - Logging__LogLevel__Default=Information
      - Logging__LogLevel__Microsoft.AspNetCore=Warning

    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - traderview-doc-storage:/app/documents
    networks:
      - traderview-network

  traderview-client:
    build:
      context: .
      dockerfile: traderview/traderview.client/Dockerfile
    container_name: traderview-client
    ports:
      - "3000:80"
    depends_on:
      - traderview-server
    networks:
      - traderview-network

networks:
  traderview-network:
    driver: bridge

volumes:
  traderview-doc-storage:
    driver: local
  sqlserver_data:
    driver: local
